<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collab-Code</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="home">
        <h1 class="wordmark"></h1>
        <p class="tagline">Real-time collaborative code editor</p>

        <div class="home-actions">
            <button id="createBtn" class="primary-btn">Create Room</button>

            <div class="divider"><span>or join an existing room</span></div>

            <div class="join-row">
            <input type="text" id="roomInput" class="room-input" placeholder="Paste room ID" />
            <button id="joinBtn" class="secondary-btn">Join</button>
            </div>
        </div>

        <p id="status" class="home-status">Connecting...</p>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket=io();
        socket.on('connect',()=>{
            document.getElementById('status').innerText='Connected!  : '+socket.id;
        });
        document.getElementById('createBtn').addEventListener('click',()=>{
            socket.emit('create-room');
        });
        socket.on('room-created',(roomId)=>{
            window.location.href=`/editor.html?roomId=${roomId}`;
        });
        document.getElementById('joinBtn').addEventListener('click',()=>{
            const roomId=document.getElementById('roomInput').value.trim();
            if(!roomId){
                 alert("Please enter a Room Id");
                 return;
            } 
            socket.emit('check-room',roomId,(exists)=>{
                if(exists){
                    window.location.href=`/editor.html?roomId=${roomId}`;
                }else{
                    alert('Room does not exist');
                }
            });
        });
        socket.on('error',(message)=>{
            alert(message);
        });
    </script>
</body>
</html>
