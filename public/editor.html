<!DOCTYPE html>
<html lang="en">
<head>
  <title>Editor — CollabCode</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
  <style>
    .remote-cursor-line{
      border-left : 2px solid #e74c3c;
      margin-left:-1px;
    }
    .remote-cursor{
      background:rgba(231, 76, 60, 0.1);
    }
  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topbar">
    <h1>CollabCode</h1>
    <span id="status" class="status">Loading...</span>
    <span id="roomInfo" class="room-info"></span>
  </div>

  <div id="editor" class="editor"></div>

  <div class="controls">
    <select id="language" class="lang-select">
      <option value="javascript">JavaScript</option>
      <option value="python">Python</option>
      <option value="cpp">C++</option>
      <option value="java">Java</option>
      <option value="c">C</option>
    </select>
    <button id="runBtn" class="run-btn">Run</button>
  </div>

  <pre id="output" class="output">Output will appear here...</pre>
  
  <script>
    const socket = io();
    require.config({paths : {vs : 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs'}});
    let editor;
    let applyingRemote=false; // flag to prevent infinite loop of changes
    let version=0; // document version this client is synced to
    let myIdentity = null;
    const remoteCursors={};
    const injectedStyles={}
    // listen for changes in our editor -> send to server
    // since monaco loads asynchronously we are writing these
    //events here
    require(['vs/editor/editor.main'],function(){
      editor=monaco.editor.create(document.getElementById('editor'),{
        value:'// Start coding here...',
        language:'javascript',
        theme:'vs',
        automaticLayout:true,
        fontSize:15,
        minimap:{enabled:false}
      });
      // event -> {changes:[{range:{startLineNumber, startColumn, endLineNumber, endColumn}, text, rangeLength}]
      editor.onDidChangeModelContent((event)=>{
        if(applyingRemote){
          return; // skip if this change is from remote update
        }
        event.changes.forEach((change)=>{
          const position=editor.getModel().getOffsetAt({
            lineNumber:change.range.startLineNumber,
            column:change.range.startColumn
          });
          
          // delete operation
          if(change.rangeLength>0){
            console.log('SENDING DELETE:', {position:position, length:change.rangeLength, version:version});
            socket.emit('operation',{
              roomId,
              operation:{position:position,text:"",length:change.rangeLength},
              version:version
            });
          }
          // insert
          if(change.text.length>0){
            socket.emit('operation',{
              roomId,
              operation:{position:position,text:change.text,length:0},
              version:version
            });
          }
        });

      });
      socket.on('operation',(data)=>{
        console.log('RECEIVED OP:', data);  
        applyingRemote=true; // set flag to prevent loop

        const operation=data.operation;
        version = data.version; // keeping our version in sync with server

          const model=editor.getModel();
          const startPos=model.getPositionAt(operation.position);
          const endPos=model.getPositionAt(operation.position + operation.length);

          editor.executeEdits('remote',[{
            range : new monaco.Range(
              startPos.lineNumber,startPos.column,
              endPos.lineNumber,endPos.column
            ),
            text : operation.text
          }]);

          applyingRemote = false;
     });
      socket.on('ack',(data)=>{
        version=data.version; // our own op was applied,sync to it's version
        });

      editor.onDidChangeCursorPosition((e)=>{
        const offset=editor.getModel().getOffsetAt(e.position);
        socket.emit('cursor-move',{
          roomId,
          position:offset
        });
      });

      socket.on('cursor-update',(data)=>{
        const model=editor.getModel();
        const pos=model.getPositionAt(data.position);
  // inject a per-user style once
       if(!injectedStyles[data.socketId]){
        const styleEl = document.createElement('style');
        const safeClass = 'cursor-' + data.socketId.replace(/[^a-zA-Z0-9]/g, '');
        styleEl.textContent = `
          .${safeClass} {
            border-left: 2px solid ${data.color};
            margin-left: -1px;
          }
          .${safeClass}::after {
            content: "${data.name}";
            position: absolute;
            top: 1.4em;
            background: ${data.color};
            color: white;
            font-size: 10px;
            padding: 1px 4px;
            border-radius: 3px;
            white-space: nowrap;
          }
        `;
        document.head.appendChild(styleEl);
        injectedStyles[data.socketId] = safeClass;
      }

      const safeClass = injectedStyles[data.socketId];
      const oldDecorations = remoteCursors[data.socketId] || [];
      const newDecoration = editor.deltaDecorations(oldDecorations,[{
        range:new monaco.Range(pos.lineNumber,pos.column,pos.lineNumber,pos.column),
        options:{
          beforeContentClassName: safeClass
        }
      }]);
      remoteCursors[data.socketId] = newDecoration; 
      });

      socket.on('cursor-remove',(socketId)=>{
        const old=remoteCursors[socketId] || [];
        editor.deltaDecorations(old,[]);
        delete remoteCursors[socketId];
      });

      document.getElementById('runBtn').addEventListener('click', () => {
      const code = editor.getValue();
      const outputEl = document.getElementById('output');
      const runBtn = document.getElementById('runBtn');

      runBtn.disabled = true;
      outputEl.textContent = 'Running...';

      socket.emit('execute-code', { code }, (result) => {
        outputEl.textContent = result.output;
        runBtn.disabled = false;
      });
  });
    
});
    


    const params=new URLSearchParams(window.location.search);
    const roomId=params.get('roomId');

    if(!roomId){
      document.getElementById('status').textContent='No room ID in URL';
    }else{ 
      document.getElementById('roomInfo').textContent=`Room : ${roomId}`;
      
      socket.on('connect',()=>{
        socket.emit('join-room',roomId);
      });


      socket.on('room-joined',(data)=>{
        myIdentity = data.self;
        document.getElementById('status').textContent=`joined room ${data.roomId} as ${data.self.name}`;
      });

      socket.on('error',(msg)=>{
        document.getElementById('status').textContent=`${msg}`;
      });
    }
  </script>

</body>
</html>
